<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FF8C00" />
      <stop offset="85%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2691E" />
      <stop offset="50%" stop-color="#CD853F" />
      <stop offset="100%" stop-color="#8B4513" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flame Halo -->
  <circle cx="32" cy="18" r="14" fill="#FFD700" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Outer Flame -->
  <path d="M32 6 C36 14 41 18 41 24 C41 29 37 33 32 33 C27 33 23 29 23 24 C23 18 28 14 32 6 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  
  <!-- Inner Flame Core -->
  <path d="M32 14 C34 18 37 20 37 24 C37 27 35 29 32 29 C29 29 27 27 27 24 C27 20 30 18 32 14 Z" fill="#FFF8DC"/>

  <!-- Diya Bowl -->
  <path d="M12 36 C12 36 20 33 32 33 C44 33 52 36 52 36 C54 44 46 52 32 52 C18 52 10 44 12 36 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="32" cy="36" rx="20" ry="4" fill="#A0522D"/>
  <ellipse cx="32" cy="36" rx="16" ry="2.5" fill="#FF8C00" opacity="0.8"/>

  <!-- Ornaments -->
  <circle cx="32" cy="44" r="2" fill="#FFD700"/>
  <circle cx="24" cy="42" r="1.5" fill="#FFD700"/>
  <circle cx="40" cy="42" r="1.5" fill="#FFD700"/>

  <!-- Diya Stand -->
  <path d="M22 52 C26 55 38 55 42 52 L40 56 C36 58 28 58 24 56 Z" fill="#8B4513"/>
</svg>
